<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>最終結果 改善案</title>
<!-- 改善案（アプリには入れていない）。中身（順位・アイコン・名前・点・各回の順位・同点の説明・2つのボタン）は今の最終結果と同じ。
     「あなたは○位でした」と順位の絵は、前に消すと決めたので出さない -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="共通.css">
<style>
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 14px 18px; display: grid; gap: 14px; align-content: start; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
/* 1行：順位・アイコン・名前・点、その下に各回の順位 */
.row {
  display: grid; grid-template-columns: 44px 56px 1fr auto; grid-template-rows: auto auto; align-items: center; gap: 4px 10px;
  padding: 12px 12px 10px; border-radius: 4px; background: rgba(23, 10, 20, 0.55); border: 1px solid rgba(214, 176, 92, 0.35);
}
/* 1位だけ、金の二重線の枠と角の飾り */
.row.first { border-color: var(--gold-line); background: rgba(58, 29, 51, 0.8); }
.place { font-family: var(--font-deco); font-weight: 800; font-size: 22px; letter-spacing: 0.04em; text-align: center; white-space: nowrap; }
.avatar {
  width: 56px; height: 56px; border-radius: 50%; overflow: hidden; display: block;
  box-shadow: 0 0 0 1.5px var(--gold-mid), 0 0 0 3.5px var(--bg-deep), 0 0 0 4.5px var(--gold-line-2);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row.first .avatar { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 0 4px var(--gold), 0 0 14px 4px rgba(255, 214, 120, 0.6); }
.name { display: flex; flex-direction: column; min-width: 0; font-family: var(--font-deco); font-weight: 800; font-size: 18px; letter-spacing: 0.08em; line-height: 1.3; white-space: nowrap; }
.name small { font-family: var(--font-read); font-weight: 400; font-size: 16px; letter-spacing: 0; color: var(--ink-dim); }
.score { font-weight: 800; font-size: 22px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rounds { grid-column: 1 / -1; font-size: 16px; color: var(--ink-dim); padding-top: 6px; border-top: 1px solid rgba(214, 176, 92, 0.2); }
.rounds span { white-space: nowrap; }
.row.me .name, .row.me .score { color: var(--gold); }
.tie { color: var(--ink-dim); text-align: center; font-size: 16px; }
</style>
</head>
<body>
<main class="screen" id="screen">
  <header class="gbar sub">
    <span></span>
    <h1 class="round gold-text">最終結果</h1>
    <span></span>
  </header>
  <div class="scroll">
    <ol class="list" id="list"></ol>
    <p class="tie" id="tie" hidden>同点のときは、<wbr>3回戦目の順位が<wbr>上の人が上です。</p>
  </div>
  <footer class="foot-bar two">
    <button class="btn ghost" data-act="toTitle">タイトルへ</button>
    <button class="btn primary" data-act="again">もう一度あそぶ</button>
  </footer>
</main>
<script>
// 見本の値（今のアプリの検査用の場面と同じ：点 6・5・5・2、順位 [1,2,3,4]・[2,1,3,4]・[2,3,1,4]、最終 0・2・1・3）
const ICON = (n) => `../assets/characters/${n}/icon_game.png`;
const SEATS = [['あなた', 'キャラ1', ICON('chara1')], ['キャラ2', '', ICON('chara2')], ['キャラ3', '', ICON('chara3')], ['キャラ4', '', ICON('blonde-tomboy')]];
const SCORES = [6, 5, 5, 2];
const ROUND_RANKS = [[1, 2, 3, 4], [2, 1, 3, 4], [2, 3, 1, 4]];
const ORDER = [0, 2, 1, 3];
const RANK_NAMES = ['大富豪', '富豪', '貧民', '大貧民'];
const corners = '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>';
document.getElementById('list').innerHTML = ORDER.map((p, i) => {
  const [name, sub, icon] = SEATS[p];
  return `<li class="row ${i === 0 ? 'first frame' : ''} ${p === 0 ? 'me' : ''}">
    ${i === 0 ? corners : ''}
    <span class="place ${i === 0 ? 'gold-text' : ''}">${i + 1}位</span>
    <span class="avatar" aria-label="${name}"><img src="${icon}" alt="" draggable="false"></span>
    <span class="name">${name}${sub ? `<small>${sub}</small>` : ''}</span>
    <span class="score">${SCORES[p]}点</span>
    <span class="rounds">${ROUND_RANKS.map((r, k) => `<span>${k + 1}回戦 ${RANK_NAMES[r[p] - 1]}</span>`).join(' ／ ')}</span>
  </li>`;
}).join('');
// 同点があるときだけ説明を出す
document.getElementById('tie').hidden = new Set(SCORES).size === SCORES.length;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  // 見本なので、押したことが分かるように画面を一瞬暗くするだけ
  document.getElementById('screen').animate([{ filter: 'brightness(1)' }, { filter: 'brightness(0.6)' }, { filter: 'brightness(1)' }], { duration: 250 });
  document.body.dataset.last = el.dataset.act;
});
for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
